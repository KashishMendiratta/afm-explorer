[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-ml"
version = "0.1.0"
description = "Contact-point detection (supervised) and curve quality control (unsupervised) ML pipeline for AFM force curves"
requires-python = ">=3.10"
dependencies = [
    "afm-core",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["ml*"]
