[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-rag"
version = "0.1.0"
description = "Local retrieval-augmented knowledge layer for AFM Explorer"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3,<2.0",
    "langchain-community>=0.3,<2.0",
    "langchain-text-splitters>=0.3,<2.0",
    "numpy>=1.26,<3.0",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["afm_rag*"]
