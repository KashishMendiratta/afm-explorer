[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-mcp-server"
version = "0.1.0"
description = "MCP server exposing the AFM Explorer backend's REST API as tools for an LLM agent"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    # for in-process test coverage of the actual backend the tools call
    "afm-core",
    "afm-ml",
    "fastapi>=0.111,<1.0",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[project.scripts]
afm-mcp-server = "mcp_server.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
