[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-agent"
version = "0.1.0"
description = "Bounded autonomous AFM Explorer agent using MCP and local RAG"
requires-python = ">=3.11"
dependencies = [
    "afm-rag",
    "openai-agents>=0.6,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
afm-agent = "afm_agent.cli:main"

[tool.setuptools.packages.find]
include = ["afm_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
