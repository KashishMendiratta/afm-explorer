[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-core"
version = "0.1.0"
description = "Shared parsing, heuristic fitting, and feature extraction for AFM force-curve data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["afm_core*"]
