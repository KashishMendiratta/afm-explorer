name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install afm_core
        run: pip install -e "packages/afm_core[dev]"

      - name: Install ML package
        run: pip install -e "packages/ml[dev]"

      - name: Install MCP server
        run: pip install -e "packages/mcp_server[dev]"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: pip install -r frontend/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check packages backend frontend

      - name: Test afm_core
        run: pytest packages/afm_core/tests -q

      - name: Test ML
        run: pytest packages/ml/tests -q

      - name: Test backend
        working-directory: backend
        run: pytest tests -q

      - name: Test MCP server
        run: pytest packages/mcp_server/tests -q

      - name: Check frontend Python syntax
        run: python -m compileall -q frontend

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            config

      - name: Build production containers
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            build
